<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Josiah White</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #1e1e1e;
        color: #cccccc;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      h1 { margin: 0; font-size: 1.5rem; color: #ffffff; }
      p { margin: 0; color: #a0a0a0; font-size: 0.95rem; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.6rem 1.1rem;
        border-radius: 4px;
        background: #0e639c;
        color: #ffffff;
        text-decoration: none;
      }
      a:hover { background: #1177bb; }
      a:focus-visible { outline: 2px solid #4daafc; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>404 — file not found</h1>
    <p>That path isn't in this workspace.</p>
    <a href="/">Back to the editor</a>
  </body>
</html>

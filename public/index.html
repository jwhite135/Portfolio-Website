<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Security headers live in vercel.json, not here.

      Vercel serves real response headers, so the policy can use directives a
      <meta> tag cannot express at all — frame-ancestors, X-Content-Type-Options,
      Permissions-Policy and HSTS. Keeping a second copy in this file would mean
      two policies to keep in step, and the browser enforces the intersection of
      both, so a stale one here would silently break the site.

      If you ever serve this build from somewhere that cannot set headers, add
      the Content-Security-Policy back as a <meta http-equiv> here.
    -->


    <meta name="theme-color" content="#1e1e1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Josiah White" />
    <meta
      name="description"
      content="Josiah White — Software Engineer and Computer Science student at the University of South Carolina. Portfolio of projects and research across Java, Spring Boot, React, and AI/ML."
    />

    <link rel="canonical" href="https://josiahawhite.com/" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / social sharing -->
